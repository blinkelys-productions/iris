[package]
name = "gdtf-share"
version = "0.1.0"
description = "Iris GDTF Share: community and official fixture profile server"
edition = "2024"
rust-version = "1.90"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
